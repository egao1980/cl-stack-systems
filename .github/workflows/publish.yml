name: Publish imports

# Discover imports/*/qlfile and publish each in an isolated matrix job
# → ghcr.io/egao1980/cl-systems/<system>:<version>
#
# Push to main publishes only changed import dirs. Full matrix is explicit:
#   gh workflow run publish.yml -R egao1980/cl-stack-systems
# Single import:
#   gh workflow run publish.yml -R egao1980/cl-stack-systems -f import=<name>
on:
  push:
    branches: [main]
    paths:
      - "imports/**"
      - "scripts/publish-import.lisp"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      import:
        description: "Single import directory under imports/ (empty = all)"
        required: false
        default: ""
      registry:
        description: "OCI registry"
        required: false
        default: "ghcr.io"
      publish_ql_deps:
        description: "ql-export unresolved deps (true/false)"
        required: false
        default: "false"

env:
  PACKAGER_TAG: "latest"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      imports: ${{ steps.list.outputs.imports }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: list
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch + import=NAME → that one only.
          # workflow_dispatch with empty import → all (explicit full republish).
          # push to main → only import dirs that changed (never the full matrix).
          if [ -n "${{ inputs.import }}" ]; then
            NAME="${{ inputs.import }}"
            if [ ! -f "imports/${NAME}/qlfile" ]; then
              echo "Missing imports/${NAME}/qlfile" >&2
              exit 1
            fi
            jq -cn --arg i "$NAME" '[$i]' > /tmp/imports.json
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "No usable before SHA; refusing full-matrix publish on push" >&2
              echo '[]' > /tmp/imports.json
            else
              git diff --name-only "$BEFORE" "$GITHUB_SHA" \
                | sed -n 's|^imports/\([^/]*\)/.*|\1|p' \
                | sort -u \
                | while read -r n; do
                    [ -f "imports/${n}/qlfile" ] && printf '%s\n' "$n"
                  done \
                | jq -R -s -c 'split("\n") | map(select(length>0))' \
                > /tmp/imports.json
            fi
          else
            find imports -mindepth 2 -maxdepth 2 -name qlfile -type f \
              | sed 's|^imports/||; s|/qlfile$||' \
              | sort \
              | jq -R -s -c 'split("\n") | map(select(length>0))' \
              > /tmp/imports.json
          fi
          echo "imports=$(cat /tmp/imports.json)" >> "$GITHUB_OUTPUT"
          echo "Discovered:"
          cat /tmp/imports.json

  publish:
    needs: discover
    if: needs.discover.outputs.imports != '[]'
    strategy:
      fail-fast: false
      matrix:
        import: ${{ fromJson(needs.discover.outputs.imports) }}
    runs-on: ubuntu-latest
    container: ghcr.io/egao1980/cl-repository/ci-base:latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
    env:
      SBCL_VERSION: "2.6.7"
      ROSWELL_VERSION: "26.02.116"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          version: latest
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: Ensure packager
        run: |
          set -euo pipefail
          ros -e "(sb-ext:disable-debugger)" \
              -e '(asdf:load-system "cl-repository-client")' \
              -e '(cl-repo:add-registry "https://ghcr.io" :namespace "egao1980/cl-repository" :priority :prepend)' \
              -e '(cl-repo:add-registry "https://ghcr.io" :namespace "egao1980/cl-systems" :priority :append)' \
              -e "(cl-repo:ensure-systems \"cl-repository-packager\" :version \"${PACKAGER_TAG}\" :default-source :oci)" \
              -e '(cl-repo:ensure-systems "cl-oci-client" :default-source :oci)' \
              -q

      - name: Publish import
        env:
          PKG_QLFILE: imports/${{ matrix.import }}/qlfile
          OCI_REGISTRY: ${{ inputs.registry || 'ghcr.io' }}
          OCI_NAMESPACE: egao1980/cl-systems
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_CATALOG: "true"
          PUBLISH_QL_DEPS: ${{ inputs.publish_ql_deps || 'false' }}
        run: |
          echo "=== $(cat "$PKG_QLFILE") ==="
          ros -l scripts/publish-import.lisp -q
